services:
  jobmanager:
    build:
      context: ./flink-job
      dockerfile: Dockerfile.flink-python
    image: real-time-api-monitoring-flink-python:1.18
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
    volumes:
      - ./flink-job:/opt/flink/job:ro
      - ./config:/opt/flink/config-custom
      - ./events:/opt/flink/events
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  taskmanager:
    image: real-time-api-monitoring-flink-python:1.18
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes:
      - ./flink-job:/opt/flink/job:ro
      - ./config:/opt/flink/config-custom
      - ./events:/opt/flink/events
